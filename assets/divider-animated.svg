<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16" viewBox="0 0 900 16">
  <defs>
    <linearGradient id="premiumGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117" />
      <stop offset="20%" style="stop-color:#667eea">
        <animate attributeName="stop-color" values="#667eea;#764ba2;#f093fb;#667eea" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#f093fb">
        <animate attributeName="stop-color" values="#f093fb;#667eea;#764ba2;#f093fb" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" style="stop-color:#764ba2">
        <animate attributeName="stop-color" values="#764ba2;#f093fb;#667eea;#764ba2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#0d1117" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Thicker animated gradient line -->
  <rect x="0" y="7" width="900" height="2" fill="url(#premiumGradient)" rx="1"/>
  
  <!-- Glowing shooting particle -->
  <circle cx="0" cy="8" r="4" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" values="0;900;0" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;1;0;0;1;1;1;0" dur="6s" repeatCount="indefinite" />
  </circle>
</svg>
