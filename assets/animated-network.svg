<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea" />
      <stop offset="100%" style="stop-color:#f093fb" />
    </linearGradient>
    <filter id="glowNode" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect x="0" y="0" width="400" height="150" fill="#0d1117" />
  
  <g stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.6">
    <!-- Connections -->
    <line x1="50" y1="75" x2="150" y2="40" />
    <line x1="50" y1="75" x2="150" y2="110" />
    <line x1="150" y1="40" x2="250" y2="75" />
    <line x1="150" y1="110" x2="250" y2="75" />
    <line x1="250" y1="75" x2="350" y2="40" />
    <line x1="250" y1="75" x2="350" y2="110" />
    <line x1="150" y1="40" x2="150" y2="110" />
    <line x1="250" y1="75" x2="350" y2="75" />
  </g>
  
  <!-- Pulses along the lines -->
  <circle cx="50" cy="75" r="2" fill="#fff">
    <animate attributeName="cx" values="50;150" dur="2s" repeatCount="indefinite" />
    <animate attributeName="cy" values="75;40" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="75" r="2" fill="#fff">
    <animate attributeName="cx" values="50;150" dur="2s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="cy" values="75;110" dur="2s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="40" r="2" fill="#fff">
    <animate attributeName="cx" values="150;250" dur="2s" repeatCount="indefinite" />
    <animate attributeName="cy" values="40;75" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="110" r="2" fill="#fff">
    <animate attributeName="cx" values="150;250" dur="2s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="cy" values="110;75" dur="2s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1s" repeatCount="indefinite" />
  </circle>

  <g filter="url(#glowNode)">
    <!-- Nodes -->
    <circle cx="50" cy="75" r="5" fill="#667eea">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="40" r="5" fill="#764ba2">
      <animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="110" r="5" fill="#764ba2">
      <animate attributeName="r" values="5;8;5" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="75" r="6" fill="#f093fb">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="350" cy="40" r="5" fill="#667eea">
      <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="350" cy="75" r="4" fill="#667eea">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="350" cy="110" r="5" fill="#667eea">
      <animate attributeName="r" values="5;7;5" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
